project:
  name: "CGVR Induction Motor Digital Twin"
  motor_profile: induction
  model_class: "MotorDigitalTwin.InductionMotorDigitalTwin18kW"
  reference_source: "Modelica Standard Library 4.1.0 IMC_withLosses"

induction_motor_digital_twin:
  reference_source: "Modelica Standard Library 4.1.0 IMC_withLosses"
  rated_output_W: 18500.0
  rated_voltage_line_line_V: 400.0
  rated_current_A: 32.85
  rated_efficiency: 0.9049
  rated_speed_rpm: 1462.5
  rated_torque_Nm: 120.794521
  frequency_Hz: 50.0
  ambient_temperature_C: 20.0
  winding_frame_Rth_K_per_W: 0.010
  frame_ambient_Rth_K_per_W: 0.0296652
  winding_thermal_capacitance_J_per_K: 15000.0
  frame_thermal_capacitance_J_per_K: 35000.0
  initial_winding_C: 90.0
  initial_frame_C: 77.4827
  winding_loss_fraction: 0.644
  fixed_loss_fraction: 0.356
  cooling_flow_offset: 0.0
  cooling_flow_gain: 1.0
  cooling_residual_threshold_C: 0.02
  cooling_residual_clear_C: 0.015
  cooling_severity_scale_C: 0.10
  safety:
    winding_warning_C: 100.0
    winding_critical_C: 120.0
    minimum_load_pu: 0.50
    reference_load_pu: 1.00
  provenance:
    manufacturer_identified: false
    winding_frame_resistance: "Explicit lumped model assumption"
    frame_ambient_resistance: "Calculated from MSL nominal loss, 90 C reference winding temperature, and assumed 20 C ambient"
    winding_and_frame_capacitance: "Explicit lumped model assumptions"
    winding_loss_fraction: "Calculated from MSL nominal stator and rotor copper losses divided by total losses"
    safety_limits: "Controller evaluation thresholds; not verified thermal limits for this unidentified motor"

simulation:
  communication_step_s: 0.5
  stop_time_s: 1800.0
  default_load_pu: 1.0
  default_speed_pu: 1.0
  default_cooling_flow_pu: 1.0
  max_fmu_communication_step_s: 0.1

vr_trial_scenarios:
  quiet_window_s: [30.0, 60.0]
  profile_duration_s: 600.0
  random_seed: 20260930
  severity_bands:
    medium_fault_severity: 0.50
    high_controller_mode: EMERGENCY
    critical_temperature_C: 120.0
  scenarios:
    bearing_wear_proxy:
      friction_factor: 2.0
      profile: ramp
      limitation: "Friction-only proxy; the rotational-only plant has no radial vibration model."
    sensor_bias:
      sensor_bias_C: 10.0
      profile: ramp
    sensor_drift:
      sensor_bias_C: 10.0
      profile: ramp
      negative_control: true
    sensor_freeze:
      profile: step
    cooling:
      cooling_efficiency: 0.40
      profile: accelerating
    cooling_failure:
      cooling_efficiency: 0.05
      profile: accelerating
    rth_degradation:
      rth_degradation: 2.0
      profile: ramp
    overload:
      load_overload_pu: 0.20
      profile: ramp
    sudden_overload:
      load_increase_pu: 0.50
      profile: step_command
    mechanical_friction:
      friction_factor: 2.0
      profile: ramp
    voltage_imbalance:
      voltage_unbalance_pu: 0.03
      profile: ramp
    supply_degradation:
      supply_degradation_pu: 0.10
      profile: ramp
    frequency_deviation:
      frequency_deviation_pu: 0.02
      profile: ramp
    combined_supported:
      sensor_bias_C: 8.0
      cooling_efficiency: 0.60
      load_overload_pu: 0.10
      supply_degradation_pu: 0.05
      profile: combined

basyx:
  environment_url: "http://localhost:8081"
  snapshot_period_s: 10.0
  persistence: in_memory
